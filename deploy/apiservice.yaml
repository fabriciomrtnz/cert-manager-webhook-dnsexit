apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.dnsexit.acme.internal
  annotations:
    # Value is <namespace>/<Certificate name> -- NOT the Secret name.
    # cert-manager reads that Certificate and injects its CA into spec.caBundle.
    cert-manager.io/inject-ca-from: infra/dnsexit-webhook-tls
spec:
  group: dnsexit.acme.internal
  groupPriorityMinimum: 1000
  versionPriority: 15
  version: v1alpha1
  service:
    name: dnsexit-webhook      # Must match your webhook Service name
    namespace: infra           # Must match your webhook Service namespace

