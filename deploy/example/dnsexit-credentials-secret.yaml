# EXAMPLE ONLY — do not commit real credentials.
# Create your DNS API key at: DNSExit dashboard -> Settings -> DNS API Key.
# This Secret must live in the same namespace cert-manager reads from
# (its cluster-resource namespace, e.g. "infra") for ClusterIssuers.
apiVersion: v1
kind: Secret
metadata:
  name: dnsexit-credentials
  namespace: infra
type: Opaque
stringData:
  apiKey: "REPLACE_WITH_YOUR_DNSEXIT_API_KEY"
